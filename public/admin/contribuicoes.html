<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contribuições - Painel AMUT</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    'amut-blue': '#00B8FE', 'amut-red': '#FF0F18', 'amut-purple': '#9E2FF8',
    'amut-green': '#2CC73D', 'amut-navy': '#13266A'
  } } } }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/img/logo.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#13266A">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  body{font-family:'Poppins',sans-serif;}
  .lbl{display:block;font-size:.8rem;font-weight:500;color:#475569;margin-bottom:.25rem;}
  .inp{width:100%;padding:.55rem .75rem;border:1px solid #cbd5e1;border-radius:.5rem;font-size:.875rem;}
  .inp:focus{outline:none;box-shadow:0 0 0 2px #00B8FE;border-color:#00B8FE;}
</style>
</head>
<body class="bg-slate-100 text-slate-800">

<div class="flex h-screen overflow-hidden">
  <aside class="w-64 shrink-0 overflow-y-auto bg-amut-navy text-white flex-col hidden md:flex">
    <div class="flex items-center gap-3 px-6 py-5 border-b border-white/10">
      <img src="../assets/img/logo.png" class="h-10 w-auto rounded bg-white/90 p-0.5" alt="Logo AMUT">
      <div class="leading-tight"><p class="font-bold">AMUT</p><p class="text-xs text-slate-300">Painel de Gestão</p></div>
    </div>
      <nav class="flex-1 px-3 py-5 space-y-1 text-sm">
      <a href="dashboard.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-white/10 transition"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard</a>
      <a href="pacientes.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-white/10 transition"><i data-lucide="users" class="w-5 h-5"></i> Pacientes</a>
      <a href="responsaveis.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-white/10 transition"><i data-lucide="user-check" class="w-5 h-5"></i> Responsáveis</a>
      <a href="eventos.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-white/10 transition"><i data-lucide="calendar" class="w-5 h-5"></i> Eventos</a>
      <a href="contribuicoes.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-white/10 font-semibold"><i data-lucide="dollar-sign" class="w-5 h-5"></i> Contribuições</a>
      <a href="usuarios.html" data-somente-admin class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-white/10 transition"><i data-lucide="key-round" class="w-5 h-5"></i> Usuários</a>
      <a href="perfil.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-white/10 transition"><i data-lucide="user" class="w-5 h-5"></i> Meu Perfil</a>
    </nav>
    <button onclick="logout()" class="m-3 px-4 py-2.5 rounded-lg bg-amut-red/90 hover:bg-amut-red transition font-semibold text-sm">Sair</button>
  </aside>

  <div class="flex-1 min-w-0 flex flex-col">
    <header class="bg-white shadow-sm px-4 md:px-8 py-4 flex items-center justify-between">
      <h1 class="text-lg md:text-xl font-bold text-amut-navy">Contribuições</h1>
      <div class="flex items-center gap-3">
        <div class="text-right hidden sm:block">
          <p id="usuario-nome" class="text-sm font-semibold text-slate-700"></p>
          <p id="usuario-cargo" class="text-xs text-slate-400"></p>
        </div>
        <div id="usuario-iniciais" class="w-10 h-10 rounded-full bg-amut-blue text-white flex items-center justify-center font-bold"></div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
      <!-- Cards de resumo -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
          <p class="text-sm text-slate-500">Arrecadado no mês atual</p>
          <p id="card-total-mes" class="text-2xl font-extrabold text-amut-green mt-1">–</p>
        </div>
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
          <p class="text-sm text-slate-500">Contribuintes no mês</p>
          <p id="card-contribuintes-mes" class="text-2xl font-extrabold text-amut-blue mt-1">–</p>
        </div>
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
          <p class="text-sm text-slate-500">Total arrecadado (geral)</p>
          <p id="card-total-geral" class="text-2xl font-extrabold text-amut-navy mt-1">–</p>
        </div>
      </div>

      <!-- Filtros -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex flex-wrap gap-3 items-center justify-between">
        <div class="flex flex-wrap gap-3 flex-1">
          <input id="filtro-busca" type="text" placeholder="Buscar por contribuinte ou paciente..."
            class="flex-1 min-w-[220px] px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amut-blue">
          <input id="filtro-mes" type="month" class="px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amut-blue">
        </div>
        <div class="flex gap-2">
          <button onclick="imprimirRelatorioMensal()" class="border border-amut-navy text-amut-navy hover:bg-amut-navy hover:text-white transition font-semibold px-5 py-2.5 rounded-lg whitespace-nowrap">
            📄 Relatório Mensal
          </button>
          <button onclick="abrirModalNovaContribuicao()" class="bg-amut-navy hover:bg-amut-blue transition text-white font-semibold px-5 py-2.5 rounded-lg shadow whitespace-nowrap">
            + Nova Contribuição
          </button>
        </div>
      </div>

      <!-- Tabela -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500">
              <tr class="text-left">
                <th class="py-3 px-4">Data</th>
                <th class="py-3 px-4">Contribuinte</th>
                <th class="py-3 px-4">Vinculado a</th>
                <th class="py-3 px-4">Mês ref.</th>
                <th class="py-3 px-4">Forma</th>
                <th class="py-3 px-4">Valor</th>
                <th class="py-3 px-4 text-right">Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-contribuicoes">
              <tr><td colspan="7" class="py-8 text-center text-slate-400">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="flex items-center justify-between px-4 py-3 border-t text-sm text-slate-500">
          <span id="info-paginacao">–</span>
          <div class="flex gap-2">
            <button onclick="mudarPagina(-1)" class="px-3 py-1.5 border rounded-lg hover:bg-slate-50">← Anterior</button>
            <button onclick="mudarPagina(1)" class="px-3 py-1.5 border rounded-lg hover:bg-slate-50">Próxima →</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal: Nova/Editar Contribuição -->
<div id="modal-contribuicao" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col">
    <div class="flex items-center justify-between px-6 py-4 border-b shrink-0">
      <h2 id="modal-contribuicao-titulo" class="text-lg font-bold text-amut-navy">Nova Contribuição</h2>
      <button onclick="fecharModalContribuicao()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
    </div>
    <div class="px-6 py-5 overflow-y-auto grid md:grid-cols-2 gap-4">
      <input type="hidden" id="c-id">

      <div class="md:col-span-2 relative z-20">
        <label class="lbl">Vincular a um responsável cadastrado (opcional)</label>
        <div id="c-responsavel-busca"></div>
      </div>

      <div class="md:col-span-2"><label class="lbl">Nome do contribuinte *</label><input id="c-nome" class="inp" placeholder="Nome completo"></div>
      <div><label class="lbl">Telefone</label><input id="c-telefone" class="inp"></div>
      <div><label class="lbl">Forma de pagamento</label>
        <select id="c-forma" class="inp">
          <option>PIX</option><option>Dinheiro</option><option>Transferência</option><option>Cartão</option><option>Outro</option>
        </select>
      </div>
      <div><label class="lbl">Valor (R$) *</label><input id="c-valor" type="number" step="0.01" min="0" class="inp" placeholder="0,00"></div>
      <div><label class="lbl">Data da contribuição *</label><input id="c-data" type="date" class="inp"></div>
      <div class="md:col-span-2"><label class="lbl">Mês de referência</label><input id="c-mes" type="month" class="inp"></div>
      <div class="md:col-span-2"><label class="lbl">Observações</label><textarea id="c-observacoes" rows="2" class="inp"></textarea></div>
    </div>
    <p id="erro-form-contribuicao" class="hidden text-red-600 text-sm px-6 shrink-0"></p>
    <div class="flex justify-end gap-3 px-6 py-4 border-t bg-slate-50 rounded-b-2xl shrink-0">
      <button onclick="fecharModalContribuicao()" class="px-5 py-2.5 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 font-medium">Cancelar</button>
      <button onclick="salvarContribuicao()" class="px-6 py-2.5 rounded-lg bg-amut-navy hover:bg-amut-blue transition text-white font-semibold">Salvar</button>
    </div>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/pwa.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/busca-select.js"></script>
<script src="../assets/js/impressao.js"></script>
<script src="../assets/js/contribuicoes.js"></script>

<script>
  lucide.createIcons();
</script>

</body>
</html>
