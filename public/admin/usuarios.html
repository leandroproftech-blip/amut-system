<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuários - Painel AMUT</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    'amut-blue': '#00B8FE', 'amut-red': '#FF0F18', 'amut-purple': '#9E2FF8',
    'amut-green': '#2CC73D', 'amut-navy': '#13266A'
  } } } }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/img/logo.png">
<style>body{font-family:'Poppins',sans-serif;} .lbl{display:block;font-size:.8rem;font-weight:500;color:#475569;margin-bottom:.25rem;} .inp{width:100%;padding:.55rem .75rem;border:1px solid #cbd5e1;border-radius:.5rem;font-size:.875rem;} .inp:focus{outline:none;box-shadow:0 0 0 2px #00B8FE;border-color:#00B8FE;}</style>
</head>
<body class="bg-slate-100 text-slate-800">

<div class="flex h-screen overflow-hidden">
  <aside class="w-64 shrink-0 overflow-y-auto bg-amut-navy text-white flex-col hidden md:flex">
    <div class="flex items-center gap-3 px-6 py-5 border-b border-white/10">
      <img src="../assets/img/logo.png" class="h-10 w-auto rounded bg-white/90 p-0.5" alt="Logo AMUT">
      <div class="leading-tight"><p class="font-bold">AMUT</p><p class="text-xs text-slate-300">Painel de Gestão</p></div>
    </div>
    <nav class="flex-1 px-3 py-5 space-y-1 text-sm">
      <a href="dashboard.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-white/10 transition"> <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard</a>
      <a href="pacientes.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-white/10 transition"> <i data-lucide="users" class="w-5 h-5"></i> Pacientes</a>
      <a href="responsaveis.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-white/10 transition"><i data-lucide="user-check" class="w-5 h-5"></i> Responsáveis</a>
      <a href="eventos.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-white/10 transition"><i data-lucide="calendar" class="w-5 h-5"></i> Eventos</a>
      <a href="contribuicoes.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-white/10 transition"><i data-lucide="dollar-sign" class="w-5 h-5"></i> Contribuições</a>
      <a href="usuarios.html" data-somente-admin class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-white/10 font-semibold"> <i data-lucide="key-round" class="w-5 h-5"></i>  Usuários</a>
      <a href="perfil.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-white/10 transition"><i data-lucide="user" class="w-5 h-5"></i>  Meu Perfil</a>
    </nav>
    <button onclick="logout()" class="m-3 px-4 py-2.5 rounded-lg bg-amut-red/90 hover:bg-amut-red transition font-semibold text-sm">Sair</button>
  </aside>

  <div class="flex-1 min-w-0 flex flex-col">
    <header class="bg-white shadow-sm px-4 md:px-8 py-4 flex items-center justify-between">
      <h1 class="text-lg md:text-xl font-bold text-amut-navy">Usuários do Sistema</h1>
      <div class="flex items-center gap-3">
        <div class="text-right hidden sm:block">
          <p id="usuario-nome" class="text-sm font-semibold text-slate-700"></p>
          <p id="usuario-cargo" class="text-xs text-slate-400"></p>
        </div>
        <div id="usuario-iniciais" class="w-10 h-10 rounded-full bg-amut-blue text-white flex items-center justify-center font-bold"></div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
      <div class="flex justify-end">
        <button onclick="abrirModalNovoUsuario()" class="bg-amut-navy hover:bg-amut-blue transition text-white font-semibold px-5 py-2.5 rounded-lg shadow">
          + Novo Usuário
        </button>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500">
              <tr class="text-left">
                <th class="py-3 px-4">Nome</th>
                <th class="py-3 px-4">E-mail</th>
                <th class="py-3 px-4">Cargo</th>
                <th class="py-3 px-4">Status</th>
                <th class="py-3 px-4">Último acesso</th>
                <th class="py-3 px-4 text-right">Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-usuarios">
              <tr><td colspan="6" class="py-8 text-center text-slate-400">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal -->
<div id="modal-usuario" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg">
    <div class="flex items-center justify-between px-6 py-4 border-b">
      <h2 id="modal-usuario-titulo" class="text-lg font-bold text-amut-navy">Novo Usuário</h2>
      <button onclick="fecharModalUsuario()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
    </div>
    <div class="px-6 py-5 grid md:grid-cols-2 gap-4">
      <input type="hidden" id="u-id">
      <div class="md:col-span-2"><label class="lbl">Nome completo</label><input id="u-nome" class="inp"></div>
      <div class="md:col-span-2"><label class="lbl">E-mail</label><input id="u-email" type="email" class="inp"></div>
      <div><label class="lbl">Cargo</label>
        <select id="u-cargo" class="inp">
          <option value="colaborador">Colaborador(a)</option>
          <option value="presidente">Presidente</option>
          <option value="admin">Administrador(a)</option>
        </select>
      </div>
      <div><label class="lbl">Telefone</label><input id="u-telefone" class="inp"></div>
      <div class="md:col-span-2">
        <label class="lbl" id="u-senha-label">Senha</label>
        <input id="u-senha" type="password" class="inp" placeholder="Mínimo 6 caracteres">
        <p id="u-senha-ajuda" class="text-xs text-slate-400 mt-1 hidden">Deixe em branco para manter a senha atual.</p>
      </div>
      <div id="u-status-wrapper" class="md:col-span-2 hidden flex items-center gap-2">
        <input type="checkbox" id="u-ativo" checked>
        <label for="u-ativo" class="text-sm text-slate-600">Usuário ativo</label>
      </div>
    </div>
    <p id="erro-form-usuario" class="hidden text-red-600 text-sm px-6"></p>
    <div class="flex justify-end gap-3 px-6 py-4 border-t bg-slate-50 rounded-b-2xl">
      <button onclick="fecharModalUsuario()" class="px-5 py-2.5 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 font-medium">Cancelar</button>
      <button onclick="salvarUsuario()" class="px-6 py-2.5 rounded-lg bg-amut-navy hover:bg-amut-blue transition text-white font-semibold">Salvar</button>
    </div>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>

<script>
  lucide.createIcons();
</script>

<script>
  exigirCargo('admin');
  preencherUsuarioNoHeader();
  const usuarioLogado = getUsuarioLogado();

  async function carregarUsuarios() {
    const tbody = document.getElementById('tabela-usuarios');
    tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-slate-400">Carregando...</td></tr>';
    try {
      const lista = await api.get('/usuarios');
      tbody.innerHTML = '';
      lista.forEach((u) => {
        const tr = document.createElement('tr');
        tr.className = 'border-t hover:bg-slate-50';
        tr.innerHTML = `
          <td class="py-3 px-4 font-medium text-slate-700">${u.nome}</td>
          <td class="py-3 px-4">${u.email}</td>
          <td class="py-3 px-4 capitalize">${u.cargo}</td>
          <td class="py-3 px-4"><span class="px-2 py-1 rounded-full text-xs font-semibold ${u.ativo ? 'bg-green-100 text-green-700' : 'bg-slate-200 text-slate-500'}">${u.ativo ? 'Ativo' : 'Inativo'}</span></td>
          <td class="py-3 px-4 text-slate-500">${u.ultimo_login ? new Date(u.ultimo_login).toLocaleString('pt-BR') : 'Nunca'}</td>
          <td class="py-3 px-4 text-right space-x-2 whitespace-nowrap">
            <button onclick="abrirModalEditarUsuario(${u.id})" class="text-amut-blue hover:underline text-xs font-semibold">Editar</button>
            ${u.id !== usuarioLogado.id ? `<button onclick="excluirUsuario(${u.id})" class="text-amut-red hover:underline text-xs font-semibold">Excluir</button>` : ''}
          </td>`;
        tbody.appendChild(tr);
      });
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-500">${err.message}</td></tr>`;
    }
  }

  function abrirModalNovoUsuario() {
    document.getElementById('modal-usuario-titulo').textContent = 'Novo Usuário';
    document.getElementById('u-id').value = '';
    document.getElementById('u-nome').value = '';
    document.getElementById('u-email').value = '';
    document.getElementById('u-cargo').value = 'colaborador';
    document.getElementById('u-telefone').value = '';
    document.getElementById('u-senha').value = '';
    document.getElementById('u-senha-label').textContent = 'Senha';
    document.getElementById('u-senha-ajuda').classList.add('hidden');
    document.getElementById('u-status-wrapper').classList.add('hidden');
    document.getElementById('erro-form-usuario').classList.add('hidden');
    document.getElementById('modal-usuario').classList.remove('hidden');
  }

  async function abrirModalEditarUsuario(id) {
    try {
      const u = await api.get(`/usuarios/${id}`);
      document.getElementById('modal-usuario-titulo').textContent = 'Editar Usuário';
      document.getElementById('u-id').value = u.id;
      document.getElementById('u-nome').value = u.nome;
      document.getElementById('u-email').value = u.email;
      document.getElementById('u-cargo').value = u.cargo;
      document.getElementById('u-telefone').value = u.telefone || '';
      document.getElementById('u-senha').value = '';
      document.getElementById('u-senha-label').textContent = 'Nova senha';
      document.getElementById('u-senha-ajuda').classList.remove('hidden');
      document.getElementById('u-status-wrapper').classList.remove('hidden');
      document.getElementById('u-ativo').checked = !!u.ativo;
      document.getElementById('erro-form-usuario').classList.add('hidden');
      document.getElementById('modal-usuario').classList.remove('hidden');
    } catch (err) {
      alert('Erro ao carregar usuário: ' + err.message);
    }
  }

  function fecharModalUsuario() {
    document.getElementById('modal-usuario').classList.add('hidden');
  }

  async function salvarUsuario() {
    const erroBox = document.getElementById('erro-form-usuario');
    erroBox.classList.add('hidden');

    const id = document.getElementById('u-id').value;
    const dados = {
      nome: document.getElementById('u-nome').value.trim(),
      email: document.getElementById('u-email').value.trim(),
      cargo: document.getElementById('u-cargo').value,
      telefone: document.getElementById('u-telefone').value.trim()
    };
    const senha = document.getElementById('u-senha').value;

    try {
      if (id) {
        if (senha) dados.senha = senha;
        dados.ativo = document.getElementById('u-ativo').checked;
        await api.put(`/usuarios/${id}`, dados);
      } else {
        if (!senha) throw new Error('Defina uma senha para o novo usuário.');
        dados.senha = senha;
        await api.post('/usuarios', dados);
      }
      fecharModalUsuario();
      carregarUsuarios();
    } catch (err) {
      erroBox.textContent = err.message;
      erroBox.classList.remove('hidden');
    }
  }

  async function excluirUsuario(id) {
    if (!confirm('Tem certeza que deseja excluir este usuário do sistema?')) return;
    try {
      await api.delete(`/usuarios/${id}`);
      carregarUsuarios();
    } catch (err) {
      alert('Erro ao excluir: ' + err.message);
    }
  }

  carregarUsuarios();
</script>
</body>
</html>
