<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar - Painel AMUT</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      'amut-blue': '#00B8FE', 'amut-red': '#FF0F18', 'amut-purple': '#9E2FF8',
      'amut-green': '#2CC73D', 'amut-navy': '#13266A'
    } } }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/img/logo.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#13266A">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel AMUT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>body{font-family:'Poppins',sans-serif;} .gradient-hero{background:linear-gradient(135deg,#13266A 0%,#0d1a4d 60%,#00B8FE 160%);}</style>
</head>
<body class="min-h-screen gradient-hero flex items-center justify-center px-4">

  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <div class="flex flex-col items-center mb-6">
        <img src="assets/img/logo.png" alt="Logo AMUT" class="h-20 w-auto mb-3">
        <h1 class="text-xl font-bold text-amut-navy text-center">Painel de Gestão AMUT</h1>
        <p class="text-sm text-slate-500 text-center mt-1">Entre com seu e-mail e senha de colaborador(a)</p>
      </div>

      <div id="erro-login" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-3 mb-4"></div>

      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
          <input type="email" id="email" required autocomplete="username"
            class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amut-blue"
            placeholder="seuemail@amut.org.br">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
          <input type="password" id="senha" required autocomplete="current-password"
            class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amut-blue"
            placeholder="••••••••">
        </div>
        <button type="submit" id="btn-entrar"
          class="w-full bg-amut-navy hover:bg-amut-blue transition text-white font-semibold py-3 rounded-lg shadow">
          Entrar
        </button>
      </form>

      <button type="button" data-instalar-app
        class="hidden w-full mt-3 border-2 border-amut-navy text-amut-navy hover:bg-amut-navy hover:text-white transition font-semibold py-2.5 rounded-lg flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>
        Instalar aplicativo
      </button>

      <a href="index.html" class="block text-center text-sm text-slate-500 hover:text-amut-blue mt-6 transition">← Voltar ao site</a>
    </div>
    <p class="text-center text-white/70 text-xs mt-6">Associação Mães Unidas pelo TEA · Lábrea - Amazonas</p>
  </div>

<script src="assets/js/config.js"></script>
<script src="assets/js/pwa.js"></script>
<script>
  // Se já estiver logado, vai direto pro painel
  if (localStorage.getItem('amut_token')) {
    window.location.href = 'admin/dashboard.html';
  }

  const form = document.getElementById('form-login');
  const erroBox = document.getElementById('erro-login');
  const btn = document.getElementById('btn-entrar');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erroBox.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;

    try {
      const resposta = await fetch(`${API_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, senha })
      });
      const dados = await resposta.json();

      if (!resposta.ok) {
        throw new Error(dados.erro || 'Não foi possível entrar.');
      }

      localStorage.setItem('amut_token', dados.token);
      localStorage.setItem('amut_usuario', JSON.stringify(dados.usuario));
      window.location.href = 'admin/dashboard.html';
    } catch (err) {
      erroBox.textContent = err.message;
      erroBox.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
